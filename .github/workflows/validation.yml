name: Validation — Python and privacy guards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check changes for trailing whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --check "$BASE_SHA"...HEAD

      - name: Test suite
        run: uv run pytest -q

      - name: Compile Python modules
        run: .venv/bin/python -m compileall -q app tests examples marketing proof_social operations site_release client0_workspace

      - name: Client0 private workspace synthetic drill (NO LIVE HOME)
        run: |
          uv run python -m client0_workspace.workspace --synthetic-drill > "$RUNNER_TEMP/ba-wp027.json"
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "ba-wp027.json").read_text())
          assert result["kind"] == "client0_synthetic_workspace_drill"
          assert result["status"] == "pass"
          assert result["bootstrap_idempotent"] is True
          assert result["template_sha256_matches"] is True
          assert result["real_workspace_accessed"] is False
          assert result["backup_restore_verified"] is False
          assert result["external_action_taken"] is False
          print("WP027_PRIVATE_WORKSPACE=PASS synthetic_only=true backup_verified=false")
          PY

      - name: Client0 isolated index recovery synthetic drill (NO REAL BACKUP)
        run: |
          uv run python -m client0_workspace.recovery --synthetic-drill > "$RUNNER_TEMP/ba-wp028.json"
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "ba-wp028.json").read_text())
          assert report["kind"] == "client0_synthetic_index_recovery"
          assert report["status"] == "pass"
          assert report["snapshot_files"] == report["restored_files"] == 3
          assert report["integrity_sha256_verified"] is True
          assert report["restore_isolated"] is True
          assert report["archive_encrypted"] is False
          assert report["real_workspace_accessed"] is False
          assert report["real_backup_restore_verified"] is False
          assert report["production_backup_authorized"] is False
          assert report["external_action_taken"] is False
          print("WP028_SYNTHETIC_RECOVERY=PASS real_backup=false encrypted=false")
          PY

      - name: Synthetic F2 rehearsal is never a real approval
        run: |
          uv run python -m operations.rehearsal --run > rehearsal-result.json
          uv run python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("rehearsal-result.json").read_text())
          assert data["kind"] == "synthetic_f2_operational_rehearsal"
          assert data["simulation_result"] == "simulated_sequence_complete"
          assert len(data["completed_simulated_gates"]) == 12
          assert data["finance_projection"] == "simulated_settled"
          assert len(data["known_live_gaps"]) >= 7
          for flag in ("commercial_success", "f2_exit_met", "contact_authorized",
                       "proposals_sent", "publication_authorized", "external_action_taken"):
              assert data[flag] is False, flag
          print("REHEARSAL_CONTRACT=PASS (external actions and F2 exit blocked)")
          PY
          rm -f rehearsal-result.json

      - name: Static-site JavaScript syntax
        run: node --check app/operator_ui/app.js


      - name: Prepare static site review bundle (NO DEPLOY)
        run: |
          uv run python -m site_release.prepare --output "$RUNNER_TEMP/ba-site-candidate" > "$RUNNER_TEMP/ba-site-manifest.json"
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((temp / "ba-site-manifest.json").read_text())
          directory = temp / "ba-site-candidate"
          assert report["kind"] == "site_release_candidate"
          assert report["site_asset_count"] == 4
          assert report["publication_authorized"] is False
          assert report["deploy_performed"] is False
          expected = {"index.html", "styles.css", "favicon.svg", "_headers"}
          assert {p.name for p in directory.iterdir()} == expected
          assert {entry["name"] for entry in report["assets"]} == expected
          for entry in report["assets"]:
              data = (directory / entry["name"]).read_bytes()
              assert entry["bytes"] == len(data)
              assert entry["sha256"] == hashlib.sha256(data).hexdigest()
          print("WP025_RELEASE_CANDIDATE=PASS assets=4 deploy=false")
          PY

      - name: Prepare portable static candidate (NO HOST, NO DEPLOY)
        run: |
          uv run python -m site_release.prepare --target portable-static --output "$RUNNER_TEMP/ba-static-portable" > "$RUNNER_TEMP/ba-static-portable.json"
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          data = json.loads((root / "ba-static-portable.json").read_text())
          files = root / "ba-static-portable"
          assert data["kind"] == "site_release_candidate"
          assert data["target"] == "portable-static"
          assert data["site_asset_count"] == 3
          assert data["headers_metadata_bundled"] is False
          assert data["http_headers_verified"] is False
          assert data["publication_authorized"] is False
          assert data["deploy_performed"] is False
          expected = {"index.html", "styles.css", "favicon.svg"}
          assert {p.name for p in files.iterdir()} == expected
          assert {item["name"] for item in data["assets"]} == expected
          for item in data["assets"]:
              blob = (files / item["name"]).read_bytes()
              assert item["bytes"] == len(blob)
              assert item["sha256"] == hashlib.sha256(blob).hexdigest()
          print("PORTABLE_SITE=PASS files=3 headers_verified=false deploy=false")
          PY

      - name: Retain portable site bundle for later hardware review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fenatodev-portable-static-${{ github.sha }}
          path: ${{ runner.temp }}/ba-static-portable/
          if-no-files-found: error
          retention-days: 7

      - name: Retain reviewed site files for MANUAL publication decision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fenatodev-site-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/ba-site-candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Proof-social template must remain blocked
        run: |
          uv run python -m proof_social.checklist --template-check > proof-check.json
          uv run python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("proof-check.json").read_text())
          assert result["status"] == "blocked"
          assert result["publication_authorized"] is False
          assert result["external_action_taken"] is False
          print("TEMPLATE_CHECK=PASS (publication remains blocked)")
          PY
          rm -f proof-check.json
