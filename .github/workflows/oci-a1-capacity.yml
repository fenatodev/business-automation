name: OCI A1 Always Free capacity attempt

on:
  schedule:
    - cron: '33 * * * *' # hourly UTC; GitHub may delay jobs
  workflow_dispatch: # manual invocations are READ-ONLY inspection

permissions:
  contents: read

concurrency:
  group: oracle-a1-capacity
  cancel-in-progress: false

jobs:
  try-once:
    # Disabled by default, and requires explicit action from the account owner.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.OCI_A1_ENABLED == 'true') }}
    environment: oci-a1-provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Oracle official CLI
        run: python -m pip install --disable-pip-version-check 'oci-cli==3.95.0'
      - name: Prepare short-lived OCI config
        env:
          OCI_A1_TENANCY_OCID: ${{ secrets.OCI_A1_TENANCY_OCID }}
          OCI_A1_USER_OCID: ${{ secrets.OCI_A1_USER_OCID }}
          OCI_A1_API_FINGERPRINT: ${{ secrets.OCI_A1_API_FINGERPRINT }}
          OCI_A1_API_PRIVATE_KEY: ${{ secrets.OCI_A1_API_PRIVATE_KEY }}
          OCI_A1_SSH_PUBLIC_KEY: ${{ secrets.OCI_A1_SSH_PUBLIC_KEY }}
        shell: bash
        run: |
          umask 077
          python - <<'PY'
          import os
          from pathlib import Path

          required = ('OCI_A1_TENANCY_OCID', 'OCI_A1_USER_OCID', 'OCI_A1_API_FINGERPRINT',
                      'OCI_A1_API_PRIVATE_KEY', 'OCI_A1_SSH_PUBLIC_KEY')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing required OCI GitHub secrets: ' + ', '.join(missing))
          home = Path.home()
          directory = home / '.oci'
          directory.mkdir(mode=0o700, exist_ok=True)
          (directory / 'api.pem').write_text(os.environ['OCI_A1_API_PRIVATE_KEY'])
          (directory / 'public_ssh.pub').write_text(os.environ['OCI_A1_SSH_PUBLIC_KEY'].strip() + '\n')
          content = '\n'.join((
              '[DEFAULT]',
              'user=' + os.environ['OCI_A1_USER_OCID'],
              'fingerprint=' + os.environ['OCI_A1_API_FINGERPRINT'],
              'key_file=' + str(directory / 'api.pem'),
              'tenancy=' + os.environ['OCI_A1_TENANCY_OCID'],
              'region=sa-saopaulo-1',
              '',
          ))
          (directory / 'config').write_text(content)
          for path in (directory / 'api.pem', directory / 'public_ssh.pub', directory / 'config'):
              path.chmod(0o600)
          PY
      - name: Read-only inspection OR bounded launch
        env:
          OCI_A1_TENANCY_OCID: ${{ secrets.OCI_A1_TENANCY_OCID }}
        run: |
          export OCI_A1_SSH_PUBLIC_KEY_PATH="$HOME/.oci/public_ssh.pub"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python ops/oracle/a1_once.py --inspect
          else
            python ops/oracle/a1_once.py --apply
          fi
