# WP-057: Junie Agent Sandbox
#
# This docker-compose.yml creates a restricted container for the Junie agent
# process itself, not just the n8n executor. The goal is to confine the agent
# so that it cannot access Docker socket, sudo, LXD, n8n SQLite, secrets, or
# the user's real home directory.
#
# Key isolation guarantees:
# 1. Non-root user (no sudo, no docker group, no lxd group)
# 2. Read-only filesystem (with specific writable directories)
# 3. No Docker socket mount
# 4. No n8n data directory mount
# 5. No host network access (--network none for testing)
# 6. no-new-privileges security option
# 7. Resource limits (CPU/memory)
# 8. No MCP servers that can control the host
# 9. No access to user's real home directory
# 10. No SSH agent or ~/.config mount
#
# IMPORTANT: This configuration is PREPARED but NOT APPLIED.
# Applying it requires explicit user approval (Gate B).
#
# Two profiles are defined:
#
# 1. "test" profile (default): network_mode: none — no network access at all.
#    Use for offline validation and negative tests:
#      docker compose -f ops/agent-sandbox/docker-compose.yml run --rm junie-agent python /workspace/healthcheck.py
#
# 2. "operational" profile: restricted network with DNS only for authentication
#    and inference. No access to n8n, Docker socket, local network, or host services.
#    Use after explicit approval:
#      docker compose -f ops/agent-sandbox/docker-compose.yml --profile operational up -d
#
# Rollback:
#   docker compose -f ops/agent-sandbox/docker-compose.yml down

services:
  junie-agent:
    build:
      context: ../..
      dockerfile: ops/agent-sandbox/Dockerfile
    container_name: junie-agent-sandbox
    read_only: true
    user: "junie-agent:junie-agent"
    # Default profile (test): Explicitly disable all network access
    # To use operational profile with restricted connectivity, add:
    #   profiles: ["operational"]
    #   networks:
    #     junie-agent-restricted:
    #       aliases:
    #         - junie-agent
    network_mode: none
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    volumes:
      # Workspace is writable for project files
      # NOTE: This volume shadows the files copied in Dockerfile.
      # For validation without volumes, use: docker run --rm <image>
      - junie-agent-workspace:/workspace
      # Logs and Junie config are writable
      - junie-agent-data:/var/log/junie-agent
      # Persistent ledger for approval signatures (WP-056)
      - junie-agent-ledger:/var/log/junie-agent/ledger
    environment:
      # Junie API key for authentication — MUST be injected at runtime
      JUNIE_API_KEY: "${JUNIE_API_KEY:-}"
      # Reduced-scope Git token for repository access
      GIT_TOKEN: "${GIT_TOKEN:-}"
      # Task to execute in headless mode
      TASK: "${TASK:-}"
      # Junie home directory inside container
      JUNIE_HOME: "/var/log/junie-agent"
      # User home directory inside container
      HOME: "/workspace"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python /workspace/healthcheck.py || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Do NOT expose ports to host
    # Do NOT mount Docker socket
    # Do NOT mount n8n data directory
    # Do NOT mount user's real home directory
    # Do NOT mount ~/.config or ~/.junie from host
    # Do NOT mount SSH agent socket

  # Operational profile: restricted network with DNS only
  # This service is mutually exclusive with junie-agent (different profiles)
  junie-agent-operational:
    build:
      context: ../..
      dockerfile: ops/agent-sandbox/Dockerfile
    container_name: junie-agent-operational
    profiles:
      - operational
    read_only: true
    user: "junie-agent:junie-agent"
    networks:
      junie-agent-restricted:
        aliases:
          - junie-agent
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    volumes:
      - junie-agent-workspace:/workspace
      - junie-agent-data:/var/log/junie-agent
      - junie-agent-ledger:/var/log/junie-agent/ledger
    environment:
      JUNIE_API_KEY: "${JUNIE_API_KEY:-}"
      GIT_TOKEN: "${GIT_TOKEN:-}"
      TASK: "${TASK:-}"
      JUNIE_HOME: "/var/log/junie-agent"
      HOME: "/workspace"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python /workspace/healthcheck.py || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  junie-agent-workspace:
    driver: local
  junie-agent-data:
    driver: local
  junie-agent-ledger:
    driver: local

# Restricted network for operational profile only
# This network has DNS resolution but NO internet access by default
# It is INTERNAL — no outbound traffic to external networks
# The agent can only reach services explicitly connected to this network
networks:
  junie-agent-restricted:
    driver: bridge
    internal: true  # No internet access — only inter-container communication
    ipam:
      config:
        - subnet: 172.28.0.0/24
